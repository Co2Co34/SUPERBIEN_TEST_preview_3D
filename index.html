<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maquette Interactive - Tunnel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-btn {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      color: #222;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      z-index: 10;
    }

    .nav-btn:hover {
      background: #ffffff;
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
    }

    .nav-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(10px);
    }

    .arrow {
      font-size: 16px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="viewer">
    <video id="video" src="DSR_transi_01.mp4" muted playsinline preload="auto"></video>

    <button id="btnForward" class="nav-btn">
      <span>Explorer le tunnel</span>
      <span class="arrow">↑</span>
    </button>

    <button id="btnBack" class="nav-btn hidden">
      <span class="arrow">←</span>
      <span>Retour à l'entrée</span>
    </button>
  </div>

  <script>

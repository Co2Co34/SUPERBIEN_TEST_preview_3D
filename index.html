<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maquette Interactive - Tunnel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 999px;
      color: #222;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      transition: all 0.25s ease;
      z-index: 999;
    }

    .nav-btn:hover {
      background: #ffffff;
      transform: translateX(-50%) translateY(-2px);
    }

    .nav-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(10px);
    }
  </style>
</head>
<body>

  <div class="viewer">
    <video id="video" src="DSR_transi_01.mp4" muted playsinline preload="auto"></video>

    <button id="btnForward" class="nav-btn" type="button">
      <span>Explorer le tunnel</span>
      <span>↑</span>
    </button>

    <button id="btnBack" class="nav-btn hidden" type="button">
      <span>←</span>
      <span>Retour à l'entrée</span>
    </button>
  </div>

  <script>
    const video = document.getElementById('video');
    const btnForward = document.getElementById('btnForward');
    const btnBack = document.getElementById('btnBack');
    let isRewinding = false;

    // Sécurité autoplay iframe
    video.muted = true;

    video.addEventListener('error', () => {
      alert("Erreur : impossible de charger DSR_transi_01.mp4. Vérifie le nom exact du fichier sur GitHub.");
    });

    btnForward.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isRewinding) return;
      btnForward.classList.add('hidden');
      video.play().catch(err => {
        console.error(err);
        btnForward.classList.remove('hidden');
      });
    });

    video.addEventListener('ended', () => {
      btnBack.classList.remove('hidden');
    });

    btnBack.addEventListener('click', (e) => {
      e.stopPropagation();
      btnBack.classList.add('hidden');
      isRewinding = true;
      video.pause();

      let lastTime = performance.now();

      function rewindStep(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        if (video.currentTime <= 0.03) {
          video.currentTime = 0;
          isRewinding = false;
          btnForward.classList.remove('hidden');
          return;
        }

        video.currentTime = Math.max(0, video.currentTime - dt);
        requestAnimationFrame(rewindStep);
      }

      requestAnimationFrame(rewindStep);
    });
  </script>

</body>
</html>
